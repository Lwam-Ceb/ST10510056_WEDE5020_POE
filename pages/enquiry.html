<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | JingoTech Provider</title>

    <link rel="icon" type="image/png" href="../assets/images/icon.png">

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <a href="../index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html">Repairs</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="faq.html">FAQ</a>

    </header>


    <main>

        <section class="page-banner">

            <p class="eyebrow">BOOK A SERVICE</p>

            <h1>How can JingoTech help?</h1>

            <p>
                Complete the enquiry form and tell us
                what you need assistance with.
            </p>

        </section>


        <section class="enquiry-section">

            <form action="#" method="post">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number">

                </div>


                <div class="form-group">

                    <label for="service">Service Required</label>

                    <select id="service" name="service" required>

                        <option value="">Select a service</option>

                        <option value="repair">
                            Computer Repair
                        </option>

                        <option value="custom-build">
                            Custom PC Build
                        </option>

                        <option value="upgrade">
                            Upgrade
                        </option>

                        <option value="maintenance">
                            Maintenance
                        </option>

                        <option value="support">
                            Technical Support
                        </option>

                        <option value="quotation">
                            Product Quotation
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">Preferred Date</label>

                    <input type="date"
                        id="date"
                        name="date">

                </div>


                <div class="form-group">

                    <label for="time">Preferred Time</label>

                    <input type="time"
                        id="time"
                        name="time">

                </div>


                <div class="form-group">

                    <label for="message">Tell us more</label>

                    <textarea id="message"
                        name="message"
                        rows="6"
                        placeholder="Describe your issue or request"></textarea>

                </div>


                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </section>

    </main>


    <footer>

        <div class="footer-navigation">

            <a href="../index.html">JINGOTECH</a>

        </div>

        <div class="footer-bottom">

            <p>© 2026 JingoTech Provider. All rights reserved.</p>

        </div>

    </footer>

</body>

</html>
